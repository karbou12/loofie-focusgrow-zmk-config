# トラックボール (PMW3610 ALT driver - Zephyr 4.1 / ZMK main対応)
CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_PMW3610_ALT=y

# Smart algorithm (surface coverage enhancement)
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

# Axis inversion: applied in SOFTWARE after the layer-based rotation transform.
# X axis is inverted to match the physical sensor mounting on Nape.
CONFIG_PMW3610_ALT_INVERT_X=y

# TraboShift: OctaShift by Tracking Ball
# CONFIG_PMW3610_ALT_TRABO_SHIFT=y
# CONFIG_PMW3610_ALT_TRABO_SHIFT_SAMPLE_TIME_MS=100
# CONFIG_PMW3610_ALT_TRABO_SHIFT_DISTANCE_THRESHOLD=800
# CONFIG_PMW3610_ALT_TRABO_SHIFT_LAYER=11
# CONFIG_PMW3610_ALT_TRABO_SHIFT_ANGLE=5
# CONFIG_ZMK_BEHAVIOR_PMW3610_ROTATION=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n

# バッテリー
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# LED
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_ONLY_PERIPHERALS=y